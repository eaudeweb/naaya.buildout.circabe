    Products.SiteErrorLog
    Products.Sessions
    Products.TemporaryFolder
    be.ldapadmin
    borg.localrole
    edw-cookiecrumbler
    edw-pycaptcha
    edw.circaimport
    eea.rdfcalendar
    eea.sentry
    eea.zeohealthcheck
    eea.zopefindsupportpatch
    naaya.content.bfile
    naaya.content-compat
    naaya.content.youtube
    naaya.groupware
    naaya.gwapplications
    naaya.gwhelp
    naaya.ldapdump
    naaya.monitor
    naaya.observatory
    naaya.photoarchive
    naaya-survey
    naaya.updater
    pas.plugins.ldap
    pdfkit
    plone.keyring
    plone.session
    Products.GenericSetup
    Products.LDAPUserFolder
    Products.MailArchive
    Products.NaayaForum
    Products.NaayaGlossary
    Products.ZMIntrospection
    repoze.sendmail
    sentry-sdk
    xlsxwriter
    xlwt
    zope.deprecation
    zope.globalrequest
zcml =
    be.ldapadmin
    edw.circaimport
    edw.circaimport-meta
    eea.sentry
    eea.zeohealthcheck
    eea.zopefindsupportpatch
    naaya.content.bfile
    naaya.content.youtube
    naaya.groupware
    naaya.gwapplications
    naaya.gwhelp
    naaya.ldapdump-meta
    naaya.monitor
    naaya.observatory
    plone.keyring
    plone.session

environment-vars =
    NAAYA_MAIL_QUEUE ${buildout:directory}/var/naaya-mail-queue
    NOTIFY_ON_ERRORS_EMAIL naayacrashteam@eaudeweb.ro
    PYTHON_EGG_CACHE ${buildout:directory}/var/egg-cache
    reCAPTCHA_PUBLIC_KEY 6LfduNgSAAAAAHLnTBACsBxFgm8YHOebx-dsTL3I
    reCAPTCHA_PRIVATE_KEY 6LfduNgSAAAAAJN3eZAzQ9svQcGZ-knvLJb1Lj-L
    SITES_LOG_PATH ${buildout:directory}/var/sites-log
    HEARTBEAT_HOST_NAME envcoord.health.fgov.be
    NETWORK_NAME Environment Belgium
    NETWORK_URL https://envcoord.health.fgov.be
    BASE_DOMAIN envcoord.health.fgov.be
    ROLES_DOMAIN envcoord.health.fgov.be
    ERROR_FROM_EMAIL error@envcoord.health.fgov.be
    MAIL_ADDRESS_FROM no-reply@envcoord.health.fgov.be
    HELPDESK_EMAIL helpdesk@envcoord.health.fgov.be
    CIRCA_CIRCLE_NAME environment
    LDAP_DISK_STORAGE ${buildout:directory}/var/ldapdump/
    LDAP_DB_NAME ldap_envcoord_health_fgov_be.db
    LDAP_PROTOCOL ldap
    CHAMELEON_CACHE ${buildout:directory}/var/cache

zcml-additional =
  <configure xmlns:ld="http://ns.eaudeweb.ro/naaya.ldapdump"
      xmlns:circaimport="http://ns.eaudeweb.ro/edw.circaimport">
    <ld:reader path="${buildout:directory}/var/ldapdump/config.yaml" />
    <circaimport:root path="${buildout:directory}/var/circa_import"/>
  </configure>

zeo-address = ${buildout:directory}/var/zeo.socket
shared-blob = on
zeo-client = on
zeo-client-blob-cache-size = 500MB
blob-storage = ${zeoserver:blob-storage}
zodb-temporary-storage = off

recipe = plone.recipe.zope2instance
#file-storage = ${buildout:directory}/var/storage/groupware/filestorage/Data.fs
access-log-level = ERROR

[envcoord-1]
<= instance-common
http-address = 8061
recipe = plone.recipe.zope2instance
event-log = ${buildout:directory}/var/log/event-envcoord-1.log
access-log = ${buildout:directory}/var/log/access-envcoord-1.log
zope-conf-additional =
    maximum-number-of-session-objects 10000

[envcoord-2]
<= instance-common
http-address = 8062
recipe = plone.recipe.zope2instance
event-log = ${buildout:directory}/var/log/event-envcoord-2.log
access-log = ${buildout:directory}/var/log/access-envcoord-2.log
zope-conf-additional =
    maximum-number-of-session-objects 10000

[envcoord-3]
<= instance-common
http-address = 8063
recipe = plone.recipe.zope2instance
event-log = ${buildout:directory}/var/log/event-envcoord-3.log
access-log = ${buildout:directory}/var/log/access-envcoord-3.log
zope-conf-additional =
    maximum-number-of-session-objects 10000

[configuration]
naaya-ldap-dump-location =
naaya-ldap-dump-conf = ${buildout:directory}/var/ldapdump/config.yaml

[ldapdump]
recipe = zc.recipe.egg
eggs = naaya.ldapdump
arguments = "${configuration:naaya-ldap-dump-conf}"

[heartbeat]
recipe = zc.recipe.egg
eggs = Naaya

[mail-sender]
recipe = zc.recipe.egg
eggs = repoze.sendmail
scripts = qp=mail-sender
