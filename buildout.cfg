[buildout]
newest = false
develop =
    src/be.ldapadmin
extends =
  versions.cfg
versions = versions
parts =
    zeoserver
    groupware
    mail-sender
    heartbeat
allow-picked-versions = false

[zeoserver]
#effective-user = zope
recipe = plone.recipe.zeoserver
pack-days = 7
eggs =
    ZODB3
    Zope2
    zope.proxy
    ZopeUndo
    tempstorage
file-storage = ${buildout:directory}/var/storage/groupware/filestorage/Data.fs
blob-storage = ${buildout:directory}/var/storage/groupware/blobstorage
zeo-address = ${buildout:directory}/var/zeo.socket
socket-name = ${buildout:directory}/var/daemon.socket
zeo-conf-additional =
     %import tempstorage
     <temporarystorage temp>
         name temporary storage for sessioning
     </temporarystorage>

[groupware]
#effective-user = zope
user = admin:admin
#debug-mode = on
eggs =
    be.ldapadmin
    collective.codemirror
    edw-pycaptcha
    edw-cookiecrumbler
    edw.circaimport
    eea.rdfcalendar
    eea.sentry
#    jsonrpc
    naaya.content.bfile
    naaya.content-compat
    naaya.content.meeting
    naaya.content.talkback
    naaya.content.youtube
    naaya.groupware
    naaya.gwapplications
    naaya.gwhelp
    naaya.monitor
    naaya.observatory
    naaya.photoarchive
    naaya.updater
    pdfkit
    Products.GenericSetup
    Products.NaayaForum
    Products.NaayaGlossary
    Products.ZSPARQLMethod
    Products.ZMIntrospection
    plone.keyring
    zope.globalrequest
    raven
    repoze.sendmail
#    transliterate
#    translitcodec
    xlwt
    zope.app.i18n
    zope.app.interface
    zope.app.component
    zope.deprecation
# for development
#    edw-extfile
    ipdb
#    pdbpp
    borg.localrole
    plone.session
    plone.app.ldap
    Products.LDAPUserFolder
    Products.PloneLDAP
zcml =
    be.ldapadmin
    collective.codemirror
    edw.circaimport
    edw.circaimport-meta
    eea.sentry
    naaya.content.bfile
    naaya.content.meeting
    naaya.content.talkback
    naaya.content.youtube
    naaya.groupware
    naaya.gwapplications
    naaya.gwhelp
    naaya.monitor
    naaya.observatory
    plone.keyring
# for development
    plone.session

environment-vars =
    NAAYA_MAIL_QUEUE ${buildout:directory}/var/naaya-mail-queue
    NOTIFY_ON_ERRORS_EMAIL naayacrashteam@eaudeweb.ro
    PYTHON_EGG_CACHE ${buildout:directory}/var/egg-cache
    reCAPTCHA_PUBLIC_KEY 6LfduNgSAAAAAHLnTBACsBxFgm8YHOebx-dsTL3I
    reCAPTCHA_PRIVATE_KEY 6LfduNgSAAAAAJN3eZAzQ9svQcGZ-knvLJb1Lj-L
    SITES_LOG_PATH ${buildout:directory}/var/sites-log
    TEST_ENVIRONMENT True
    HEARTBEAT_HOST_NAME valentin.ro
    NETWORK_NAME Environment Belgium
    NETWORK_URL https://envcoord.health.fgov.be
    BASE_DOMAIN envcoord.health.fgov.be
    ROLES_DOMAIN roles.envcoord.health.fgov.be
    ERROR_FROM_EMAIL error@envcoord.health.fgov.be
    ADDR_FROM no-reply@envcoord.health.fgov.be
    HELPDESK_EMAIL helpdesk@envcoord.health.fgov.be
    CIRCA_CIRCLE_NAME environment
    LDAP_DISK_STORAGE ${buildout:directory}/var/ldapdump/
    LDAP_DB_NAME ldap_envcoord_health_fgov_be.db

zcml-additional =
  <configure xmlns:circaimport="http://ns.eaudeweb.ro/edw.circaimport">
    <circaimport:root path="${buildout:directory}/var/circa_import"/>
  </configure>

zeo-client = on
zeo-address = ${buildout:directory}/var/zeo.socket
shared-blob = off
zeo-client-blob-cache-size = 500MB
blob-storage = ${zeoserver:blob-storage}
zodb-temporary-storage =
    <zodb_db temporary>
         mount-point /temp_folder
         container-class Products.TemporaryFolder.TemporaryContainer
         cache-size 5000
         <zeoclient>
           server ${zeoserver:zeo-address}
           storage temp
           name zeo-temp-storage
           cache-size 100MB
         </zeoclient>
     </zodb_db>

http-address = 8060
recipe = plone.recipe.zope2instance
#file-storage = ${buildout:directory}/var/storage/groupware/filestorage/Data.fs
blob-storage = ${buildout:directory}/var/blobcache

[heartbeat]
recipe = zc.recipe.egg
eggs = Naaya

[mail-sender]
recipe = zc.recipe.egg
eggs = repoze.sendmail
scripts = qp=mail-sender
