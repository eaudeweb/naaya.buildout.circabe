[buildout]
newest = false
develop =
    src/be.ldapadmin
    src/naaya/eggs/naaya.groupware
    src/naaya/eggs/naaya.gwapplications
    src/naaya/eggs/Naaya
    src/Products.MailArchive
extends =
  versions.cfg
versions = versions
parts =
    zeoserver
    groupware
    envcoord-1
    envcoord-2
    envcoord-3
    mail-sender
    heartbeat
    ldapdump
    haproxy-build
    haproxy-config
allow-picked-versions = false

[zeoserver]
#effective-user = zope
recipe = plone.recipe.zeoserver
pack-days = 7
eggs =
    ZODB3
    Zope2
    zope.proxy
    ZopeUndo
    tempstorage
file-storage = ${buildout:directory}/var/storage/groupware/filestorage/Data.fs
blob-storage = ${buildout:directory}/var/storage/groupware/blobstorage
zeo-address = ${buildout:directory}/var/zeo.socket
socket-name = ${buildout:directory}/var/daemon.socket
zeo-conf-additional =
     %import tempstorage
     <temporarystorage temp>
         name temporary storage for sessioning
     </temporarystorage>

[haproxy-build]
recipe = plone.recipe.haproxy
url = http://www.haproxy.org/download/1.6/src/haproxy-1.6.6.tar.gz
cpu = generic
target = generic

[haproxy-config]
recipe = collective.recipe.template
input = ${buildout:directory}/haproxy.tpl
output = ${buildout:directory}/haproxy.cfg
frontend-bind = 127.0.0.1:8060
frontend-backend = Zopes
backends =
    backend Zopes
        balance roundrobin
        option httpchk
        server Zope1 127.0.0.1:8061 check
        server Zope2 127.0.0.1:8062 check
        server Zope3 127.0.0.1:8063 check
        server Zope4 127.0.0.1:8064 check

[groupware]
#effective-user = zope
user = admin:admin
#debug-mode = on
eggs =
    be.ldapadmin
    collective.codemirror
    edw-pycaptcha
    edw-cookiecrumbler
    edw.circaimport
    eea.rdfcalendar
    eea.sentry
    naaya.content.bfile
    naaya.content-compat
    naaya.content.youtube
    naaya.groupware
    naaya.gwapplications
    naaya.gwhelp
    naaya.ldapdump
    naaya.monitor
    naaya.observatory
    naaya.photoarchive
    naaya.updater
    pdfkit
    Products.GenericSetup
    Products.MailArchive
    Products.NaayaForum
    Products.NaayaGlossary
    Products.ZSPARQLMethod
    Products.ZMIntrospection
    plone.keyring
    zope.globalrequest
    raven
    repoze.sendmail
#    transliterate
#    translitcodec
    xlwt
    zope.app.i18n
    zope.app.interface
    zope.app.component
    zope.deprecation
# for development
#    edw-extfile
    ipdb
#    pdbpp
    borg.localrole
    plone.session
    plone.app.ldap
    Products.LDAPUserFolder
    Products.PloneLDAP
zcml =
    be.ldapadmin
    collective.codemirror
    edw.circaimport
    edw.circaimport-meta
    eea.sentry
    naaya.content.bfile
    naaya.content.youtube
    naaya.groupware
    naaya.gwapplications
    naaya.gwhelp
    naaya.ldapdump-meta
    naaya.monitor
    naaya.observatory
    plone.keyring
# for development
    plone.session

environment-vars =
    NAAYA_MAIL_QUEUE ${buildout:directory}/var/naaya-mail-queue
    NOTIFY_ON_ERRORS_EMAIL naayacrashteam@eaudeweb.ro
    PYTHON_EGG_CACHE ${buildout:directory}/var/egg-cache
    reCAPTCHA_PUBLIC_KEY 6LfduNgSAAAAAHLnTBACsBxFgm8YHOebx-dsTL3I
    reCAPTCHA_PRIVATE_KEY 6LfduNgSAAAAAJN3eZAzQ9svQcGZ-knvLJb1Lj-L
    SITES_LOG_PATH ${buildout:directory}/var/sites-log
    TEST_ENVIRONMENT True
    HEARTBEAT_HOST_NAME envcoord.health.fgov.be
    NETWORK_NAME Environment Belgium
    NETWORK_URL https://envcoord.health.fgov.be
    BASE_DOMAIN envcoord.health.fgov.be
    ROLES_DOMAIN envcoord.health.fgov.be
    ERROR_FROM_EMAIL error@envcoord.health.fgov.be
    MAIL_ADDRESS_FROM no-reply@envcoord.health.fgov.be
    HELPDESK_EMAIL helpdesk@envcoord.health.fgov.be
    CIRCA_CIRCLE_NAME environment
    LDAP_DISK_STORAGE ${buildout:directory}/var/ldapdump/
    LDAP_DB_NAME ldap_envcoord_health_fgov_be.db
    LDAP_PROTOCOL ldap

zcml-additional =
  <configure xmlns:ld="http://ns.eaudeweb.ro/naaya.ldapdump"
      xmlns:circaimport="http://ns.eaudeweb.ro/edw.circaimport">
    <ld:reader path="${buildout:directory}/var/ldapdump/config.yaml" />
    <circaimport:root path="${buildout:directory}/var/circa_import"/>
  </configure>

zeo-address = ${buildout:directory}/var/zeo.socket
shared-blob = on
zeo-client = on
zeo-client-blob-cache-size = 500MB
blob-storage = ${zeoserver:blob-storage}
zodb-temporary-storage =
    <zodb_db temporary>
         mount-point /temp_folder
         container-class Products.TemporaryFolder.TemporaryContainer
         cache-size 5000
         <zeoclient>
           server ${zeoserver:zeo-address}
           storage temp
           name zeo-temp-storage
           cache-size 100MB
         </zeoclient>
     </zodb_db>

recipe = plone.recipe.zope2instance
#file-storage = ${buildout:directory}/var/storage/groupware/filestorage/Data.fs
z2-log-level = ERROR

[envcoord-1]
<= groupware
http-address = 8061
recipe = plone.recipe.zope2instance
event-log = ${buildout:directory}/var/log/event-envcoord-1.log
z2-log = ${buildout:directory}/var/log/z2-envcoord-1.log
zope-conf-additional =
    maximum-number-of-session-objects 10000

[envcoord-2]
<= groupware
http-address = 8062
recipe = plone.recipe.zope2instance
event-log = ${buildout:directory}/var/log/event-envcoord-2.log
z2-log = ${buildout:directory}/var/log/z2-envcoord-2.log
zope-conf-additional =
    maximum-number-of-session-objects 10000

[envcoord-3]
<= groupware
http-address = 8063
recipe = plone.recipe.zope2instance
event-log = ${buildout:directory}/var/log/event-envcoord-3.log
z2-log = ${buildout:directory}/var/log/z2-envcoord-3.log
zope-conf-additional =
    maximum-number-of-session-objects 10000

[configuration]
naaya-ldap-dump-location =
naaya-ldap-dump-conf = ${buildout:directory}/var/ldapdump/config.yaml

[ldapdump]
recipe = zc.recipe.egg
eggs = naaya.ldapdump
arguments = "${configuration:naaya-ldap-dump-conf}" 

[heartbeat]
recipe = zc.recipe.egg
eggs = Naaya

[mail-sender]
recipe = zc.recipe.egg
eggs = repoze.sendmail
scripts = qp=mail-sender
