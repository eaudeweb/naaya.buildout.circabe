# envcoord.health.fgov.be: ZEO, three Zope instances behind haproxy
[site]
versions = ${directory}/versions.cfg
eggs =
    ${naaya:eggs}
    be.ldapadmin
    edw.circaimport
    naaya.groupware
    naaya.gwapplications
    naaya.gwhelp
    naaya.ldapdump
    Products.LDAPMultiPlugins
    plone.session
    Products.LDAPUserFolder
    Products.MailArchive
zcml =
    ${naaya:zcml}
    be.ldapadmin
    edw.circaimport
    edw.circaimport-meta
    naaya.groupware
    naaya.gwapplications
    naaya.gwhelp
    naaya.ldapdump-meta
    plone.session
environment =
    NAAYA_MAIL_QUEUE ${directory}/var/naaya-mail-queue
    NOTIFY_ON_ERRORS_EMAIL naayacrashteam@eaudeweb.ro
    PYTHON_EGG_CACHE ${directory}/var/egg-cache
    reCAPTCHA_PUBLIC_KEY 6LfduNgSAAAAAHLnTBACsBxFgm8YHOebx-dsTL3I
    reCAPTCHA_PRIVATE_KEY 6LfduNgSAAAAAJN3eZAzQ9svQcGZ-knvLJb1Lj-L
    SITES_LOG_PATH ${directory}/var/sites-log
    HEARTBEAT_HOST_NAME envcoord.health.fgov.be
    NETWORK_NAME Environment Belgium
    NETWORK_URL https://envcoord.health.fgov.be
    BASE_DOMAIN envcoord.health.fgov.be
    ROLES_DOMAIN envcoord.health.fgov.be
    ERROR_FROM_EMAIL error@envcoord.health.fgov.be
    MAIL_ADDRESS_FROM no-reply@envcoord.health.fgov.be
    HELPDESK_EMAIL helpdesk@envcoord.health.fgov.be
    CIRCA_CIRCLE_NAME environment
    LDAP_DISK_STORAGE ${directory}/var/ldapdump/
    LDAP_DB_NAME ldap_envcoord_health_fgov_be.db
    LDAP_PROTOCOL ldap
    CHAMELEON_CACHE ${directory}/var/cache
zcml-additional =
    <configure xmlns:ld="http://ns.eaudeweb.ro/naaya.ldapdump"
        xmlns:circaimport="http://ns.eaudeweb.ro/edw.circaimport">
      <ld:reader path="${directory}/var/ldapdump/config.yaml" />
      <circaimport:root path="${directory}/var/circa_import"/>
    </configure>
storage = zeo
temporary-storage = zeo
zeo-client-cache-size = 500MB
access-log-level = ERROR
scripts =
    dump_ldap = naaya.ldapdump.main:dump_ldap("${directory}/var/ldapdump/config.yaml")
    heartbeat = Products.Naaya.views:heartbeat()
    mail-sender = repoze.sendmail.queue:run_console()

# var/filestorage/Data.fs, var/blobstorage and var/zeo.socket
[zeoserver]
pack-days = 7

[instance:envcoord-1]
http-address = 8061

[instance:envcoord-2]
http-address = 8062

[instance:envcoord-3]
http-address = 8063

[haproxy]
frontend-bind = 127.0.0.1:8060
frontend-backend = Zopes
backends =
    backend Zopes
        balance roundrobin
        option httpchk
        server Zope1 127.0.0.1:8061 check
        server Zope2 127.0.0.1:8062 check
        server Zope3 127.0.0.1:8063 check
